<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janson Browser</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
flex-direction:column;
background:#111;
}

#tabs{
display:flex;
background:#222;
padding:5px;
overflow-x:auto;
}

.tab{
padding:10px 15px;
background:#333;
color:white;
border-radius:8px;
margin-right:5px;
cursor:pointer;
}

.active{
background:#4285f4;
}

#newTab{
background:#28a745;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

.toolbar{
display:flex;
padding:10px;
background:#1a1a1a;
gap:10px;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:8px;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#4285f4;
color:white;
}

iframe{
flex:1;
width:100%;
border:none;
background:white;
}
</style>
</head>
<body>

<div id="tabs">
<button id="newTab">+</button>
</div>

<div class="toolbar">
<button onclick="home()">🏠</button>
<input id="url" placeholder="Search or enter URL">
<button onclick="go()">Go</button>
</div>

<iframe id="frame" srcdoc="
<h1 style='font-family:sans-serif;text-align:center;margin-top:100px;'>
🌐 Janson Browser
</h1>
<p style='text-align:center;'>Search above to browse.</p>
"></iframe>

<script>
let tabs = [{
title:"Home",
url:"home"
}];

let currentTab = 0;

function renderTabs(){

const area = document.getElementById('tabs');

area.innerHTML='';

tabs.forEach((tab,i)=>{

const t=document.createElement('div');

t.className='tab'+(i===currentTab?' active':'');

t.textContent=tab.title;

t.onclick=()=>{

currentTab=i;

if(tab.url==="home"){
home();
}else{
document.getElementById('frame').src=
tab.url;
}

renderTabs();
};

area.appendChild(t);

});

const add=document.createElement('button');

add.id='newTab';

add.textContent='+';

add.onclick=()=>{

tabs.push({
title:'New Tab',
url:'home'
});

currentTab=tabs.length-1;

renderTabs();

home();
};

area.appendChild(add);

}

function home(){

document.getElementById('frame').srcdoc=`
<h1 style="font-family:sans-serif;text-align:center;margin-top:100px;">
🌐 Janson Browser
</h1>
<p style="text-align:center;">
Search above to browse.
</p>
`;

tabs[currentTab]={
title:'Home',
url:'home'
};

renderTabs();

}

function go(){

let q=document.getElementById('url').value.trim();

if(!q) return;

let target;

if(
q.startsWith('http://') ||
q.startsWith('https://')
){

target=q;

}else if(q.includes('.')){

target='https://'+q;

}else{

target='https://www.bing.com/search?q='+
encodeURIComponent(q);

}

tabs[currentTab]={
title:q.substring(0,15),
url:target
};

document.getElementById('frame').src=
target;

renderTabs();

}

document.getElementById('url')
.addEventListener('keydown',e=>{

if(e.key==='Enter'){
go();
}

});

renderTabs();
</script>

</body>
</html>
