<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Janson Browser</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#111827;
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

#tabs{
display:flex;
align-items:center;
gap:5px;
padding:8px;
background:#1f2937;
overflow-x:auto;
}

.tab{
background:#374151;
padding:8px 15px;
border-radius:10px;
cursor:pointer;
white-space:nowrap;
}

.active{
background:#3b82f6;
}

#newTab{
background:#22c55e;
padding:8px 15px;
border:none;
border-radius:10px;
cursor:pointer;
color:white;
}

.toolbar{
display:flex;
gap:10px;
padding:10px;
background:#0f172a;
}

.toolbar input{
flex:1;
padding:12px;
border:none;
border-radius:10px;
}

.toolbar button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
background:#3b82f6;
color:white;
}

#content{
flex:1;
overflow:auto;
padding:25px;
}

.home{
text-align:center;
margin-top:50px;
}

.home h1{
font-size:52px;
margin-bottom:10px;
}

.home p{
color:#aaa;
}

.section{
margin-top:30px;
}

.section h2{
margin-bottom:10px;
}

.card{
background:#1f2937;
padding:12px;
border-radius:10px;
margin-bottom:8px;
cursor:pointer;
}

.card:hover{
background:#374151;
}
</style>
</head>
<body>

<div id="tabs">
<button id="newTab">+</button>
</div>

<div class="toolbar">
<button onclick="showHome()">🏠</button>

<input id="searchBox"
placeholder="Search the web or enter URL">

<button onclick="search()">Search</button>
</div>

<div id="content"></div>

<script>

let tabs = [
{
title:"Home",
type:"home"
}
];

let activeTab = 0;

const content =
document.getElementById("content");

function saveBookmarks(list){
localStorage.setItem(
"bookmarks",
JSON.stringify(list)
);
}

function getBookmarks(){
return JSON.parse(
localStorage.getItem("bookmarks") || "[]"
);
}

function saveHistory(item){

let history =
JSON.parse(
localStorage.getItem("history") || "[]"
);

history.unshift(item);

history = history.slice(0,50);

localStorage.setItem(
"history",
JSON.stringify(history)
);
}

function getHistory(){

return JSON.parse(
localStorage.getItem("history") || "[]"
);

}

function renderTabs(){

const area =
document.getElementById("tabs");

area.innerHTML = "";

tabs.forEach((tab,index)=>{

const el =
document.createElement("div");

el.className =
"tab " +
(index===activeTab
? "active"
: "");

el.textContent =
tab.title;

el.onclick=()=>{
activeTab=index;
renderTabs();
renderCurrent();
};

area.appendChild(el);

});

const add =
document.createElement("button");

add.id="newTab";
add.textContent="+";

add.onclick=()=>{

tabs.push({
title:"New Tab",
type:"home"
});

activeTab =
tabs.length-1;

renderTabs();
renderCurrent();

};

area.appendChild(add);

}

function showHome(){

tabs[activeTab]={
title:"Home",
type:"home"
};

renderTabs();
renderCurrent();

}

function renderCurrent(){

const tab =
tabs[activeTab];

if(tab.type==="home"){

let bookmarks =
getBookmarks();

let history =
getHistory();

content.innerHTML=
`
<div class="home">

<h1>🌐 Janson Browser</h1>

<p>Custom Browser Homepage</p>

<div class="section">
<h2>⭐ Bookmarks</h2>

<div id="bookmarks"></div>

<button onclick="addBookmark()">
Add Current Search
</button>

</div>

<div class="section">
<h2>🕒 History</h2>

<div id="history"></div>
</div>

</div>
`;

const bookmarkArea =
document.getElementById(
"bookmarks"
);

bookmarks.forEach(item=>{

bookmarkArea.innerHTML +=
`
<div class="card"
onclick="window.open('${item.url}')">

${item.name}

</div>
`;

});

const historyArea =
document.getElementById(
"history"
);

history.forEach(item=>{

historyArea.innerHTML +=
`
<div class="card">

${item}

</div>
`;

});

}
else{

content.innerHTML=
`
<div class="home">

<h1>${tab.title}</h1>

<p>Opened in browser tab</p>

</div>
`;

}

}

function search(){

const query =
document.getElementById(
"searchBox"
).value.trim();

if(!query) return;

let url;

if(
query.startsWith("http://") ||
query.startsWith("https://") ||
query.includes(".")
){

url =
query.startsWith("http")
? query
: "https://" + query;

}else{

url =
"https://www.bing.com/search?q="
+
encodeURIComponent(query);

}

saveHistory(query);

tabs[activeTab]={
title:
query.length > 20
? query.substring(0,20)+"..."
: query,
type:"search"
};

renderTabs();

window.location.href = url;

}

function addBookmark(){

const query =
document.getElementById(
"searchBox"
).value.trim();

if(!query) return;

let bookmarks =
getBookmarks();

bookmarks.push({
name:query,
url:
"https://www.bing.com/search?q="
+
encodeURIComponent(query)
});

saveBookmarks(bookmarks);

renderCurrent();

}

document
.getElementById(
"searchBox"
)
.addEventListener(
"keydown",
e=>{
if(e.key==="Enter"){
search();
}
}
);

renderTabs();
renderCurrent();

</script>

</body>
</html>
