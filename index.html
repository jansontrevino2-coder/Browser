<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Janson Browser</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#121212;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
}

#tabs{
    display:flex;
    background:#1e1e1e;
    padding:5px;
    overflow-x:auto;
}

.tab{
    background:#2a2a2a;
    padding:10px 15px;
    margin-right:5px;
    border-radius:8px;
    cursor:pointer;
}

.tab.active{
    background:#4285f4;
}

#newTab{
    background:#34a853;
    border:none;
    color:white;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.toolbar{
    display:flex;
    gap:10px;
    padding:10px;
    background:#202124;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    padding:12px;
    border:none;
    border-radius:8px;
    background:#4285f4;
    color:white;
    cursor:pointer;
}

#content{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.homepage h1{
    font-size:60px;
    color:#4285f4;
}

.homepage p{
    margin-top:15px;
    font-size:20px;
    color:#ccc;
}
</style>
</head>
<body>

<div id="tabs">
    <div class="tab active" onclick="switchTab(0)">
        Home
    </div>

    <button id="newTab" onclick="createTab()">
        +
    </button>
</div>

<div class="toolbar">
    <button onclick="goHome()">🏠</button>

    <input
        id="search"
        placeholder="Search or enter URL..."
    >

    <button onclick="searchWeb()">
        Search
    </button>
</div>

<div id="content">

    <div class="homepage">
        <h1>🌐 Janson Browser</h1>
        <p>Your custom browser homepage</p>
    </div>

</div>

<script>

let tabs = [
    {title:"Home",type:"home"}
];

let activeTab = 0;

function renderTabs(){

    const container =
    document.getElementById("tabs");

    container.innerHTML = "";

    tabs.forEach((tab,index)=>{

        const el =
        document.createElement("div");

        el.className =
        "tab" +
        (index===activeTab ? " active" : "");

        el.textContent = tab.title;

        el.onclick = ()=>{
            switchTab(index);
        };

        container.appendChild(el);

    });

    const btn =
    document.createElement("button");

    btn.id = "newTab";
    btn.textContent = "+";

    btn.onclick = createTab;

    container.appendChild(btn);
}

function switchTab(index){

    activeTab = index;

    const content =
    document.getElementById("content");

    if(tabs[index].type==="home"){

        content.innerHTML = `
        <div class="homepage">
            <h1>🌐 Janson Browser</h1>
            <p>Your custom browser homepage</p>
        </div>
        `;

    }else{

        content.innerHTML = `
        <div>
            <h2>${tabs[index].title}</h2>
            <p>Opened in a new browser tab.</p>
        </div>
        `;
    }

    renderTabs();
}

function createTab(){

    tabs.push({
        title:"New Tab",
        type:"home"
    });

    activeTab = tabs.length - 1;

    renderTabs();
    switchTab(activeTab);
}

function goHome(){

    tabs[activeTab] = {
        title:"Home",
        type:"home"
    };

    switchTab(activeTab);
}

function searchWeb(){

    const query =
    document.getElementById("search")
    .value.trim();

    if(!query) return;

    let url;

    if(
       query.startsWith("http://") ||
       query.startsWith("https://") ||
       query.includes(".")
    ){

        url = query.startsWith("http")
        ? query
        : "https://" + query;

    }else{

        url =
        "https://www.bing.com/search?q=" +
        encodeURIComponent(query);
    }

    tabs[activeTab] = {
        title:query,
        type:"site"
    };

    renderTabs();

    window.open(url,"_blank");
}

document
.getElementById("search")
.addEventListener("keydown",e=>{

    if(e.key==="Enter"){
        searchWeb();
    }

});

</script>

</body>
</html>
