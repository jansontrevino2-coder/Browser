<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Janson Browser</title>

<style>
body{
    margin:0;
    background:#111827;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.toolbar{
    display:flex;
    gap:10px;
    padding:10px;
    background:#1f2937;
}

input{
    flex:1;
    padding:12px;
}

iframe{
    flex:1;
    border:none;
    width:100%;
}
</style>
</head>

<body>

<div class="toolbar">
    <input
        id="url"
        placeholder="Enter URL"
    >
    <button onclick="go()">Go</button>
</div>

<iframe id="frame"></iframe>

<script>
async function go() {

    let url =
    document
    .getElementById("url")
    .value
    .trim();

    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ) {
        url = "https://" + url;
    }

    document
    .getElementById("frame")
    .src =
    "/api/fetch?url=" +
    encodeURIComponent(url);
}
</script>

</body>
</html>
